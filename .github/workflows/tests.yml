name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The full suite, including the Postgres backend tier, against a real server.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runstate_test
        ports:
          - 5432:5432
        # gate the steps on the server actually being ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # a DIRECT endpoint (not a transaction-mode pooler): the session advisory
      # lock and the per-connection session state depend on one stable backend.
      RUNSTATE_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/runstate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      # SERIAL on purpose: the shared `log` table + the session-end connection-leak
      # check are xdist-unsafe (cross-worker backends would cross-contaminate the
      # baseline count). Per-test uuid run_ids isolate the data; the process must not.
      - name: pytest (serial)
        run: pytest tests/
      - name: mypy --strict
        run: mypy
      - name: black --check
        run: black --check runstate/ tests/

  # `import runstate` must work WITHOUT the optional psycopg extra. The assertions live in
  # tests/test_psycopg_free.py so they are ordinary, tool-visible test code (inlined here
  # they were invisible to black, mypy, grep and the suite -- which is how a deleted symbol
  # sat in this file for six days). This job's own job is the part a meta_path blocker
  # cannot simulate: a genuinely bare install, proving the PACKAGING has no hard dep.
  import-without-psycopg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # NO extras -> psycopg is absent. pytest is the only addition and pulls nothing.
      - run: pip install -e . pytest
      - name: the public surface is psycopg-free
        run: pytest tests/test_psycopg_free.py -v

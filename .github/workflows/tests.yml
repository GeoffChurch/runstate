name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The full suite, including the Postgres backend tier, against a real server.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runstate_test
        ports:
          - 5432:5432
        # gate the steps on the server actually being ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # a DIRECT endpoint (not a transaction-mode pooler): the session advisory
      # lock and the per-connection session state depend on one stable backend.
      RUNSTATE_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/runstate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      # SERIAL on purpose: the shared `log` table + the session-end connection-leak
      # check are xdist-unsafe (cross-worker backends would cross-contaminate the
      # baseline count). Per-test uuid run_ids isolate the data; the process must not.
      # The migration oracle's families are the oracle job's (below).
      - name: pytest (serial)
        run: pytest tests/ -m "not oracle"
      - name: mypy --strict
        run: mypy
      - name: black --check
        run: black --check runstate/ tests/

  # The migration oracle (`-m oracle`): the 0.3.0 -> 0.4.0 step's engine against the
  # simulator's exhaustive families (about 7 minutes locally). The step is frozen once it
  # ships, so the job runs only when the step, its engine or facts, the simulator or
  # the oracle changes, and on demand (Actions -> tests -> Run workflow). The default
  # job runs the oracle's named histories either way.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: does the step, the simulator or the oracle change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths='^(runstate/migrations/v0_3_0_to_v0_4_0(_engine|_facts)?\.py|tests/migration_sim/|tests/test_migration_sim\.py|tests/migration_derive\.py|tests/migration_helpers\.py|tests/migration_mutation\.py|tests/test_migration_oracle\.py)'
          # on demand, or with no base to compare (a new branch): run
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo run=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.changed.outputs.run == 'true'
        run: pip install -e .[test]
      - if: steps.changed.outputs.run == 'true'
        name: pytest -m oracle
        run: pytest tests/test_migration_oracle.py -m oracle

  # `import runstate` must work WITHOUT the optional psycopg extra. The assertions live in
  # tests/test_psycopg_free.py so they are ordinary, tool-visible test code (inlined here
  # they were invisible to black, mypy, grep and the suite -- which is how a deleted symbol
  # sat in this file for six days). This job's own job is the part a meta_path blocker
  # cannot simulate: a genuinely bare install, proving the PACKAGING has no hard dep.
  import-without-psycopg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # NO extras -> psycopg is absent. pytest is the only addition and pulls nothing.
      - run: pip install -e . pytest
      - name: the public surface is psycopg-free
        run: pytest tests/test_psycopg_free.py -v

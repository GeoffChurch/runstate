[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runstate"
version = "0.2.0.dev0"
description = "Cooperative bidirectional control protocol for long-running scientific workers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
  {name = "Geoffrey Churchill"},
]
keywords = [
  "orchestration",
  "control-plane",
  "machine-learning",
  "training",
  "checkpointing",
  "topic-log",
  "protocol",
  "hpc",
  "slurm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GeoffChurch/runstate"
Repository = "https://github.com/GeoffChurch/runstate"
Issues = "https://github.com/GeoffChurch/runstate/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]
# examples/vqe only; the other examples are stdlib+runstate. qiskit needs
# numpy 2.x -- prefer a fresh venv (see examples/vqe/vqe.py's module note).
examples = ["qiskit>=1.0"]
test = ["pytest", "jsonschema", "mypy", "black", "psycopg[binary]>=3"]

[tool.setuptools.packages.find]
include = ["runstate*"]

[tool.setuptools.package-data]
runstate = ["py.typed"]

[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier(name): the concurrency contention tier a test needs (in_process | cross_process | cross_host); the conc_backend fixture skips backends below it",
]

[tool.mypy]
python_version = "3.11"
files = ["runstate"]
strict = true

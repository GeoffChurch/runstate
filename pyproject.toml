[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runstate"
version = "0.1.0"
description = "Cooperative bidirectional control protocol for long-running scientific workers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
  {name = "Geoffrey Churchill"},
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]
test = ["pytest", "jsonschema", "mypy", "psycopg[binary]>=3"]

[tool.setuptools.packages.find]
include = ["runstate*"]

[tool.setuptools.package-data]
runstate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier(name): the concurrency contention tier a test needs (in_process | cross_process | cross_host); the conc_backend fixture skips backends below it",
]

[tool.mypy]
python_version = "3.11"
files = ["runstate"]
strict = true
